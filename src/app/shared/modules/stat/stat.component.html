<div class="featured-product-card" [class]="'bg-' + bgClass">
    <div class="card-image-container">
        <img 
            [src]="src" 
            [alt]="label" 
            class="product-image"
            loading="lazy"
            decoding="async">
        <div class="card-overlay"></div>
    </div>
    <div class="card-body">
        <h3 class="product-name">{{ label }}</h3>
        <p class="product-description">{{ content }}</p>
    </div>
    <div class="card-link-footer">
        <a [href]="'/products/' + urlId" class="view-details-link">
            <span>View Details</span>
            <i class="fa fa-arrow-right"></i>
        </a>
    </div>
</div>
