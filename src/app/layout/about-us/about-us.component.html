<div [@routerTransition]>
    <app-page-header [heading]="'About Us'" [icon]="'fa-wrench'"></app-page-header>
    <!-- Interactive Feature Cards Section -->
    <section class="feature-cards-section">
        <div class="section-header">
            <h2>Why Choose Om Industries</h2>
            <p class="section-subtitle">Innovating Transformers Since 1998</p>
            <p class="section-tagline">Leading excellence in transformer manufacturing</p>
        </div>
        <div class="cards-container">
            <div 
                *ngFor="let card of featureCards; let i = index"
                class="feature-card" 
                [class.visible]="card.isVisible"
                [style.animationDelay]="(i * 0.15) + 's'"
                [attr.data-card-id]="card.id">
                <div class="card-image-wrapper" [style.backgroundImage]="'url(' + card.image + ')'">
                    <div class="card-overlay"></div>
                    <div class="card-icon-badge">
                        <i class="fa" [class]="card.icon"></i>
                    </div>
                </div>
                <div class="card-content">
                    <h3 class="card-title">{{ card.title }}</h3>
                    <p class="card-description">{{ card.description }}</p>
                </div>
            </div>
        </div>
    </section>
</div>
